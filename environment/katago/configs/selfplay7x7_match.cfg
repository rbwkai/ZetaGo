# ---------------- Logging ----------------
logSearchInfo = false
logMoves = false
logGamesEvery = 100
logToStdout = true

# ---------------- Neural Net ----------------
# g170e (not b18c384nbt): a fixed, weaker, reproducible teacher is what a supervised
# imitation study needs; b18 also triggered near-100% early resignation (Phase 0 B4).
nnModelFile = environment/katago/models/g170e-b10c128-s1141046784-d204142634.txt.gz
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 15
nnRandomize = true
nnMaxBatchSize = 32
numNNServerThreadsPerModel = 1

# ---------------- Bots ----------------
numBots = 1
botName = zeta7
extraPairs = 0-0

# ---------------- Game Generation ----------------
numGameThreads = 12
numGamesTotal = 120000
maxMovesPerGame = 120

# ---------------- Search ----------------
maxVisits = 16
numSearchThreads = 1

# ---------------- Self-play ----------------
# Resignation disabled: with a near-deterministic teacher, resignation truncated
# nearly every game before the middle/endgame (Phase 0 B4). maxMovesPerGame bounds
# runaway games instead.
allowResignation = false
resignThreshold = -0.98
resignConsecTurns = 8

# chosenMoveTemperature*: the diversity mechanism, chosen after policyInitAreaProp was
# found to be UNSAFE (see below). Raised from the original 0.80/12 to 1.2/16 -- verified
# stable at >=98% engine/KataGo oracle winner-agreement at both n=400 and n=3000 games,
# unlike every root-noise-based alternative tested (see Phase 0 addendum), which showed a
# declining agreement trend with scale and risked failing the oracle test at full corpus size.
chosenMoveTemperature = 0.10
chosenMoveTemperatureEarly = 1.2
chosenMoveTemperatureHalflife = 16

# policyInitAreaProp MUST stay 0.0 -- do not re-enable.
# KataGo's `match` subcommand does NOT record policy-initialised stones in the output SGF
# (no AB[]/AW[] setup properties, no synthetic moves): the SGF's move list simply starts
# partway through the game, at ply `startTurnIdx` (recorded only in a free-text comment).
# Measured on a 50k-game run at policyInitAreaProp=0.35: 94.3% of games had
# startTurnIdx > 0 (mean 16, median 12, max 93) -- meaning our engine's replay-from-empty-
# board silently reconstructed the WRONG board state for ~94% of games. This does not show
# up as illegal moves (a partially-filled 65%-empty board usually still accepts the next
# recorded move), only as scoring/label corruption: it dropped the oracle winner-agreement
# test to 95.5% and, far more importantly, corrupted the (state, move) label for nearly
# every extracted position, not just the disagreeing games. Confirmed via `startTurnIdx=`
# in each game's root C[] comment; see Docs/EXECUTION_Phase0.md.
initGamesWithPolicy = true
policyInitAreaProp = 0.0
policyInitAreaTemperature = 1.0

# Root Dirichlet noise (rootNoiseEnabled etc.) was also tested as an SGF-safe alternative
# (fully recorded, unlike policyInitAreaProp) and gives more diversity per game, but its
# oracle-agreement declined with scale (99.0%->98.04% and 98.4%->97.64% at n=800->2500)
# while chosenMoveTemperature alone stayed flat at 98.5% -- so it was not adopted.
compensateAfterPolicyInitProb = 0.0

# ---------------- Rules ----------------
bSizes = 7

komiAuto = false
komiMean = 9.5

koRules = POSITIONAL
scoringRules = AREA
taxRules = NONE
multiStoneSuicideLegals = false

# ---------------- Misc ----------------
# handicapProb / handicapCompensateKomiProb / hasButtons / bSizeRelProbs are the only
# `match`-honoured keys in this block; the rest (dataBoardLen, switchNetsMidGame,
# earlyForkGame*, sidePositionProb, firstFileRandMinProp, maxDataQueueSize,
# maxRowsPerTrainFile) belong to `selfplay`, not `match` -- confirmed via KataGo's own
# "Unused key" warnings (Phase 0 B3). Removed so nobody tunes a no-op.
handicapProb = 0.0
handicapCompensateKomiProb = 0.0
hasButtons = false

bSizeRelProbs = 1